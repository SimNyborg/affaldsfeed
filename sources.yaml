# Kilderegister for Affaldsfeed. Feltbeskrivelse: docs/KONTRAKTER.md §3.1 (models.Source).
#
# status:  aktiv     hentes af pipelinen (v1: kun rss og search)
#          planlagt  metoden (sitemap, html, oda) kommer i fase 2
#          kandidat  afventer beslutning, feed-URL eller ny verifikation
#          fravalgt  med i registret, men hentes ikke (se note)
#
# Alle poster er vurderet 2026-10-07. Aktive rss-kilder er hentet og parset samme dag.
# Udgivere, der kun findes via nyhedssøgning (fx lokalaviser), står i config/medier.yaml.
# Et domæne må ikke stå både her på en aktiv kilde og i config/medier.yaml.

# ── Nyhedssøgning (lag 2) ─────────────────────────────────────
- id: google-news
  name: Google News (søgning)
  category: nyhedsmedie
  homepage: https://news.google.com
  method: search
  feeds: "https://news.google.com/rss/search?q={q}+when:2d&hl=da&gl=DK&ceid=DK:da"
  filter: normal
  every: 2
  basis: redaktionelt
  status: kandidat
  checked: 2026-10-07
  note: >-
    fejlede ved verifikation 2026-10-07: robots.txt på news.google.com forbyder /rss/search for alle
    brugeragenter (User-agent: * med Disallow: /). Skal kun bruges til at finde artikler med søgeordene i
    config/search.yaml. Hvert fund krediteres den rigtige udgiver, og Google News vises aldrig selv som afsender.

- id: bing-news
  name: Bing News (søgning)
  category: nyhedsmedie
  homepage: https://www.bing.com/news
  method: search
  feeds: "https://www.bing.com/news/search?q={q}&format=rss&setlang=da-DK&cc=DK&qft=sortbydate%3d%221%22"
  filter: normal
  every: 2
  basis: redaktionelt
  status: aktiv
  checked: 2026-10-07
  note: >-
    Bruges kun til at finde artikler med søgeordene i config/search.yaml. Artikel-URL'en tages fra
    url-parameteren i apiclick-linket, og fundet krediteres den rigtige udgiver (aktiv kilde her eller
    config/medier.yaml). Ukendte udgivere havner i kildeforslag. Bing News vises aldrig selv som afsender.

