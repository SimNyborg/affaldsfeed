# Troværdige udgivere, der kun findes via nyhedssøgning (models.Publisher, KONTRAKTER §3.3 og §5.3).
#
# Et søgefund krediteres udgiveren, når artiklens værtsnavn (uden www.) står i domains.
# Aktive kilder i sources.yaml matches først. Udgivere, der hverken står her eller som aktiv
# kilde, havner i data/state/kildeforslag.md og kommer ikke i feedet.
#
# Regler:
# - id er udgiverens hoveddomæne med bindestreg i stedet for punktum (fx jv-dk). Så kolliderer
#   id'erne aldrig med sources.yaml, hvor samme medie kan stå som kandidat (fx bt og bt-dk).
# - Et domæne må ikke stå her, hvis det er homepage eller domains på en aktiv kilde i sources.yaml.
#   Når en kandidat eller planlagt kilde aktiveres, fjernes dens domæner herfra.
# - Medierne har redaktionelt ansvar (basis: redaktionelt). Universiteter uden et feed, Affaldsfeed kan
#   hente, står her med basis: forskning, så deres nyheder fra søgningen krediteres dem. Tjekket 2026-10-07.

