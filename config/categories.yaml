# Afsenderkategorierne. Kategorien står på kilden og gættes aldrig ud fra teksten.
# Nationale medier og lokalmedier er begge nyhedsmedier og deler farve. Ikonet skiller dem ad.
- id: nyhedsmedie
  name: Nationalt medie
  short: Nationalt medie
  color: "#1862B5"
  color_dark: "#68AAFE"
  icon: avis
  help: Landsdækkende nyhedsmedier og Ritzau-telegrammer med redaktionelt ansvar.
- id: lokalmedie
  name: Lokalmedie
  short: Lokalmedie
  color: "#1862B5"
  color_dark: "#68AAFE"
  icon: lokalavis
  help: Regionale dagblade, TV 2-regionerne, ugeaviser og lokale netaviser med redaktionelt ansvar.
- id: fagmedie
  name: Fagmedie
  short: Fagmedie
  color: "#107C86"
  color_dark: "#2CC4CB"
  icon: tidsskrift
  help: Fagblade og nichemedier om kommuner, forsyning, byggeri, emballage, teknik, videnskab og miljø.
- id: myndighed
  name: Myndighed og Folketing
  short: Myndighed
  color: "#5A3584"
  color_dark: "#9B86C6"
  icon: soejle
  help: Ministerier, styrelser, tilsyn, råd, nævn, Høringsportalen og Folketinget.
- id: kommunal
  name: Kommune og affaldsselskab
  short: Kommune/affaldsselskab
  color: "#065F35"
  color_dark: "#5EC587"
  icon: raadhus
  help: Kommuner og kommunalt ejede affalds-, forbrændings- og forsyningsselskaber.
- id: organisation
  name: Organisation og branche
  short: Organisation
  color: "#CA651B"
  color_dark: "#FFA350"
  icon: personer
  help: Interesse- og brancheorganisationer. Afsenderen varetager medlemmernes interesser.
- id: taenketank
  name: Tænketank og NGO
  short: Tænketank/NGO
  color: "#B8346C"
  color_dark: "#FF84BA"
  icon: paere
  help: Tænketanke og grønne organisationer, der arbejder for bestemte løsninger.
- id: forskning
  name: Forskning og universitet
  short: Forskning
  color: "#7A5C0D"
  color_dark: "#AE9417"
  icon: kolbe
  help: Universiteter, sektorforskning og godkendte teknologiske serviceinstitutter.
- id: eu_norden
  name: EU og Norden
  short: EU/Norden
  color: "#84241B"
  color_dark: "#DD7161"
  icon: stjerner
  help: EU-institutioner og europæiske eller nordiske organisationer.
# Afventer (pending): menuen viser kategorien, men den kan ikke vælges og må ikke have aktive kilder.
# Farven er grå som --muted, indtil kategorien tages i brug og får sin egen.
- id: sociale_medier
  name: Sociale medier
  short: Sociale medier
  color: "#565656"
  color_dark: "#A9B3AE"
  icon: taleboble
  help: Opslag på sociale medier, fx fra politikere, myndigheder og organisationer.
