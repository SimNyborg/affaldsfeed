# Geografi til stedfilteret på siden (KONTRAKTER §3.3 og §8.1).
#
# Steder genkendes i indslagets titel og teaser (og Claudes resumé). Et mønster er et
# stednavn eller en frase. Store og små bogstaver tæller, så "Vejen" ikke rammer "vejen";
# starter et mønster med lille bogstav, må det også stå med stort (sætningsstart).
# Mønstre matcher hele ord og tager genitiv med ("Aarhus'", "Odenses"); * til sidst =
# vilkårlige bogstaver ("fynsk*"). Overlapper to mønstre, vinder det længste, så
# "Ikast-Brande" ikke også giver byen Brande. Uden patterns bruges short (regioner og
# kommuner) eller name (byer).
#
# En by giver også sin kommune, og en kommune sin region. Byer er et udvalg af større
# byer, der ikke hedder det samme som kommunen. Tvetydige navne (fx "Vejen", "Greve",
# "Brande", "Ringe") har kun sikre fraser. ignore er navne, der ikke er et sted for
# nyheden (fx universiteter med landsdækkende forskning).

regioner:
  - id: hovedstaden
    name: Region Hovedstaden
    short: Hovedstaden
    patterns: [Region Hovedstaden, Hovedstadsregionen, hovedstadsområdet, hovedstaden, Storkøbenhavn, Nordsjælland, "nordsjællandsk*", Vestegnen, Amager]
  - id: sjaelland
    name: Region Sjælland
    short: Sjælland
    patterns: [Region Sjælland, Lolland-Falster, Vestsjælland, "vestsjællandsk*", Sydsjælland, "sydsjællandsk*", Midtsjælland, "midtsjællandsk*", Østsjælland]
  - id: syddanmark
    name: Region Syddanmark
    short: Syddanmark
    patterns: [Region Syddanmark, Syddanmark, Fyn, "fynsk*", Sønderjylland, "sønderjysk*", Sydjylland, "sydjysk*", Trekantområdet]
  - id: midtjylland
    name: Region Midtjylland
    short: Midtjylland
    patterns: [Region Midtjylland, Midtjylland, "midtjysk*", Djursland]
  - id: nordjylland
    name: Region Nordjylland
    short: Nordjylland
    patterns: [Region Nordjylland, Nordjylland, "nordjysk*", Vendsyssel, Himmerland]

