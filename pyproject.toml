[project]
name = "affaldsfeed"
version = "0.1.0"
description = "Nyheder om affaldsområdet fra troværdige danske og europæiske kilder"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
