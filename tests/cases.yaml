# Testcases for forfilter, tema og genre. Titlerne er opdigtede, men typiske.
# Køres af tests/test_cases.py mod den rigtige config/.
#
# Felter (alle undtagen id og title har standardværdier):
#   id            kort navn (bruges som test-id)
#   title, teaser
#   url           standard: https://eksempel.dk/artikel/12345 (giver ingen URL-hint)
#   category      kildens kategori (standard nyhedsmedie)
#   lang          kildens sprog (standard da)
#   source_topics kildens standardtemaer (standard [])
#   source_genre  kildens genre (standard nyhed)
#   categories    RSS-kategorier (standard [])
#   expect:
#     none/normal/strict: forventet afgørelse (vis|graa|afvist) pr. filterniveau
#     topics: forventede temaer i rækkefølge (udelades = tjekkes ikke)
#     genre:  forventet genre (udelades = tjekkes ikke)
#     places: forventede sted-id'er fra titel og teaser (udelades = tjekkes ikke)
#
# Et forkert indslag fra drift lægges her med den rigtige afgørelse, så tuning kan måles.

