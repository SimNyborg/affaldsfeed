# Afprøv kilder live fra GitHub Actions. Bruges af Claude-sessioner i skyen, hvor
# cloud-miljøet ikke selv må hente nyhedssider. Skriv kilde-id'er (én pr. linje) i
# probe/request.txt og push; resultatet committes til probe/result.md.
name: Afprøv kilder

on:
  push:
    branches: [main]
    paths:
      - "probe/request.txt"
  workflow_dispatch:
    inputs:
      ids:
        description: "Kilde-id'er adskilt af mellemrum"
        required: false

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Afprøv
        shell: bash
        env:
          INPUT_IDS: ${{ github.event.inputs.ids }}
        run: |
          ids="$INPUT_IDS"
          if [ -z "$ids" ] && [ -f probe/request.txt ]; then
            ids=$(grep -v '^\s*#' probe/request.txt | tr '\n' ' ')
          fi
          mkdir -p probe
          {
            echo "# Afprøvning $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            for id in $ids; do
              echo "## $id"
              echo
              echo '```text'
              timeout 120 python -m affaldsfeed check --fetch "$id" --explain 2>&1 | tail -n 80 || echo "(fejl eller timeout)"
              echo '```'
              echo
            done
          } > probe/result.md

      - name: Commit resultat
        shell: bash
        run: |
          git config user.name "affaldsfeed-bot"
          git config user.email "affaldsfeed-bot@users.noreply.github.com"
          git add probe/result.md
          git diff --cached --quiet && exit 0
          git commit -m "Afprøvning af kilder $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
