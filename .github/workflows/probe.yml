# Afprøv kilder live fra GitHub Actions. Bruges af Claude-sessioner i skyen, hvor
# cloud-miljøet ikke selv må hente nyhedssider. Skriv kilde-id'er (én pr. linje) i
# probe/request.txt og push; resultatet committes til probe/result.md. En linje på
# formen "url <URL> [kB]" henter URL'en råt (standard 30 kB, højst 400) i stedet for at afprøve en kilde.
name: Afprøv kilder

on:
  push:
    branches: [main]
    paths:
      - "probe/request.txt"
  workflow_dispatch:
    inputs:
      ids:
        description: "Kilde-id'er adskilt af mellemrum"
        required: false

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt pypdf

      - name: Afprøv
        shell: bash
        env:
          INPUT_IDS: ${{ github.event.inputs.ids }}
        run: |
          # Linjer: et kilde-id (check --fetch --explain) eller "url <URL> [kB]" (rå hentning, standard 30 kB).
          if [ -n "$INPUT_IDS" ]; then
            lines=$(echo "$INPUT_IDS" | tr ' ' '\n')
          elif [ -f probe/request.txt ]; then
            lines=$(grep -v '^\s*#' probe/request.txt | grep -v '^\s*$')
          fi
          ua=$(python -c "import yaml;print(yaml.safe_load(open('config/settings.yaml'))['fetch']['user_agent'])")
          mkdir -p probe
          {
            echo "# Afprøvning $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              if [[ "$line" == url\ * ]]; then
                rest="${line#url }"
                u="${rest%% *}"
                kb="${rest#"$u"}"; kb="${kb// /}"
                [[ "$kb" =~ ^[0-9]+$ ]] || kb=30
                (( kb > 400 )) && kb=400
                echo "## $u"
                echo
                echo '```text'
                if [[ "$u" == *affaldsviden.info* ]]; then
                  echo "(afvist: affaldsviden.info hentes aldrig)"
                else
                  curl -sSL --compressed -A "$ua" --max-time 60 -o /tmp/probe.bin -w "status %{http_code}, %{content_type}, %{size_download} bytes, slut-URL %{url_effective}\n" "$u" 2>&1 || echo "(curl-fejl)"
                  echo
                  if [ -f /tmp/probe.bin ]; then
                    if head -c 2 /tmp/probe.bin | od -An -tx1 | grep -q "1f 8b"; then gunzip -c /tmp/probe.bin > /tmp/probe.txt 2>/dev/null; else cp /tmp/probe.bin /tmp/probe.txt; fi
                    head -c $(( kb * 1000 )) /tmp/probe.txt | tr -d '\000'
                    rm -f /tmp/probe.bin /tmp/probe.txt
                  fi
                fi
                echo
                echo '```'
                echo
              elif [[ "$line" =~ ^(links|text|pdf|raw|rss|sitemap|feed|site|robots)\  ]]; then
                echo "## $line"
                echo
                echo '```text'
                read -r -a parts <<< "$line"
                timeout 300 python probe/hent.py "${parts[@]}" </dev/null 2>&1 | head -c 400000 || echo "(fejl eller timeout)"
                echo '```'
                echo
              else
                echo "## $line"
                echo
                echo '```text'
                timeout 180 python -m affaldsfeed check --fetch "$line" --explain </dev/null 2>&1 \
                  | awk '/\(for gammel\)/{skip=2; n++; next} skip>0{skip--; next} {print} END{if(n) print "  ("n" for gamle afvist, ikke vist)"}' \
                  | head -n 600 || echo "(fejl eller timeout)"
                echo '```'
                echo
              fi
            done <<< "$lines"
          } > probe/result.md

      - name: Commit resultat
        shell: bash
        run: |
          git config user.name "affaldsfeed-bot"
          git config user.email "affaldsfeed-bot@users.noreply.github.com"
          git add probe/result.md
          git diff --cached --quiet && exit 0
          git commit -m "Afprøvning af kilder $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
