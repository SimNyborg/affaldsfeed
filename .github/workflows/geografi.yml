# Bygger config/geografi.yaml fra Danmarks Statistik (tools/build_geografi.py). Kører, når
# værktøjet eller håndreglerne ændres, og kan startes manuelt. Rapporten lægges i probe/geografi.md.
# Den nye fil committes kun, når python -m affaldsfeed check er OK (bot-commits starter ikke CI);
# rapporten committes altid, og jobbet fejler, når check fejler.
name: Byg geografi

on:
  push:
    branches: [main]
    paths:
      - "tools/build_geografi.py"
      - "config/geografi_regler.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geografi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Byg og tjek
        id: build
        shell: bash
        run: |
          mkdir -p probe
          {
            echo "# Byg geografi $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo '```text'
            python tools/build_geografi.py --report 2>&1 || echo "(fejlede: config/geografi.yaml er ikke ændret)"
            echo '```'
            echo
            echo "## python -m affaldsfeed check"
            echo
            echo '```text'
            if python -m affaldsfeed check 2>&1; then
              echo "check_ok=true" >> "$GITHUB_OUTPUT"
            else
              echo "(check fejlede: config/geografi.yaml committes ikke)"
              echo "check_ok=false" >> "$GITHUB_OUTPUT"
            fi
            echo '```'
          } > probe/geografi.md
          cat probe/geografi.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        shell: bash
        env:
          CHECK_OK: ${{ steps.build.outputs.check_ok }}
        run: |
          git config user.name "affaldsfeed-bot"
          git config user.email "affaldsfeed-bot@users.noreply.github.com"
          git add probe/geografi.md
          if [ "$CHECK_OK" = "true" ]; then
            git add config/geografi.yaml
          else
            git checkout -- config/geografi.yaml  # behold den gyldige fil
          fi
          git diff --cached --quiet && exit 0
          git commit -m "Byg geografi $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1

      - name: Fejl, når check fejlede
        if: steps.build.outputs.check_ok != 'true'
        run: |
          echo "::error::python -m affaldsfeed check fejlede; config/geografi.yaml er ikke committet (se probe/geografi.md)."
          exit 1
