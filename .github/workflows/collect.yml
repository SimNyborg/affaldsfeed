# Indsamling hver time (:05 UTC): run → commit af data/ → export → deploy til GitHub Pages.
# Se docs/KONTRAKTER.md §10. Commits fra GITHUB_TOKEN starter ikke andre workflows.
name: Indsamling

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Fælles gruppe med publish.yml, så kun én deploy kører ad gangen. Kørsler afbrydes ikke.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Hent repo
        uses: actions/checkout@v4

      - name: Opsæt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installér afhængigheder
        run: pip install -r requirements.txt

      - name: Indsaml
        run: python -m affaldsfeed run

      - name: Commit data
        shell: bash
        run: |
          git config user.name "affaldsfeed-bot"
          git config user.email "affaldsfeed-bot@users.noreply.github.com"
          git add data/candidates data/rejected data/state
          if git diff --cached --quiet; then
            echo "Ingen ændringer i data/."
            # Hent alligevel de seneste vurderinger fra Claude-routinen før export
            git pull --rebase --autostash || echo "::warning::git pull fejlede; eksporterer med lokal kopi."
            exit 0
          fi
          git commit -m "Indsamling $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for forsoeg in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              echo "Data skubbet (forsøg $forsoeg)."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push afvist (forsøg $forsoeg)."
            sleep $((forsoeg * 5))
          done
          echo "::error::Kunne ikke skubbe data efter 3 forsøg."
          exit 1

      # Efter rebase, så Claudes seneste vurderinger og overblik kommer med
      - name: Byg site
        run: python -m affaldsfeed export --out _site

      - name: Konfigurér Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
